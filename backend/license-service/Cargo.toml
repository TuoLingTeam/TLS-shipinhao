[package]
name = "license-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
base64 = "0.22"
ed25519-dalek = "2.1"
api-contracts = { path = "../api-contracts" }
# NOTE: 不在 license-service 声明 obfstr：这个 crate 被 license-worker 编译进 wasm，
# 服务端错误文案走线后就是明文，无须 obfstr 加密；且 build_license_worker.sh 生成的临时
# workspace.dependencies 不包含 obfstr，声明了会导致 cargo metadata 失败。

[dev-dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
security_core = { path = "../../crates/security-core" }
tokio = { workspace = true, features = ["macros", "rt"] }
