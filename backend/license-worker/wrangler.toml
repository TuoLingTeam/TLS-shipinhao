# 仅用于在 backend/license-worker 目录本地调试：`npx wrangler dev`。
# 线上生产部署请使用 ../wrangler.toml（管理页与 D1 配置以 backend 为入口）。

name = "tls-shipinhao-license-worker"
main = "build/worker/shim.mjs"
compatibility_date = "2024-12-01"
workers_dev = true

[build]
command = "../scripts/build_license_worker.sh --release"

# 勿在此文件配置 routes，避免与 backend/wrangler.toml 线上路由冲突。

[vars]

[[d1_databases]]
binding = "DB"
database_name = "tls-license-db"
database_id = "dc9a0ef0-26b5-4738-9863-729a64c74a27"
