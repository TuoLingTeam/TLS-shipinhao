# 生产部署入口：在 backend/ 目录执行 `npx wrangler deploy`。
# Rust 源码在 backend/worker；管理页 HTML 唯一源文件为 worker/assets/admin.html（由 Worker include 编译进 wasm）。

name = "tls-shipinhao"
main = "./worker/build/worker/shim.mjs"
compatibility_date = "2024-12-01"
workers_dev = false

routes = [
  { pattern = "sphapi.199908.top/*", zone_name = "199908.top" },
  { pattern = "sphapi.tuoling.ccwu.cc/*", zone_name = "tuoling.ccwu.cc" },
  { pattern = "sphapi.tuoling.eu.cc/*", zone_name = "tuoling.eu.cc" },
]

[build]
command = "./scripts/build_license_worker.sh --release"

[vars]
# ADMIN_SECRET / LICENSE_SIGNING_PRIVATE_KEY_B64 通过 wrangler secret put 设置。
# V1 旧协议的 HMAC_SECRET 已彻底弃用；若线上仍残留可用 `wrangler secret delete HMAC_SECRET` 清理。

[[d1_databases]]
binding = "DB"
database_name = "tls-license-db"
database_id = "dc9a0ef0-26b5-4738-9863-729a64c74a27"
