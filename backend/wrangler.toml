name = "tls-shipinhao"
main = "src/worker/index.js"
compatibility_date = "2024-12-01"
workers_dev = false

# 自定义域名路由（绕开 workers.dev DNS 污染）
routes = [
  { pattern = "sphapi.199908.top/*", zone_name = "199908.top" }
]

# 环境变量（部署后通过 wrangler secret put 设置）
[vars]
# HMAC_SECRET 通过 wrangler secret put HMAC_SECRET 设置
# ADMIN_SECRET 通过 wrangler secret put ADMIN_SECRET 设置（管理页面登录密码）

# .html 文件以纯文本方式导入（esbuild Text loader）
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "tls-license-db"
database_id = "dc9a0ef0-26b5-4738-9863-729a64c74a27"
