name = "tls-shipinhao"
main = "src/worker/index.js"
compatibility_date = "2024-12-01"
workers_dev = false

# 旧 JS Worker 仅保留兼容提示壳；正式部署入口迁移到 apps/license-worker/wrangler.toml

routes = [
  { pattern = "sphapi.199908.top/*", zone_name = "199908.top" }
]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
