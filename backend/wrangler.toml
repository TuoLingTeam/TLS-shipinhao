name = "tls-shipinhao-license-api"
main = "src/index.js"
compatibility_date = "2024-12-01"
workers_dev = false

# 自定义域名路由（绕开 workers.dev DNS 污染）
routes = [
  { pattern = "api.199908.top/*", zone_name = "199908.top" }
]

# 环境变量（部署后通过 wrangler secret put 设置 HMAC_SECRET）
[vars]
# HMAC_SECRET 通过 wrangler secret put HMAC_SECRET 设置，不要写在这里

[[d1_databases]]
binding = "DB"
database_name = "tls-license-db"
database_id = "dc9a0ef0-26b5-4738-9863-729a64c74a27"
