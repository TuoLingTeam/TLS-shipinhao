[package]
name = "security_core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lib]
name = "security_core"
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1
strip = true
