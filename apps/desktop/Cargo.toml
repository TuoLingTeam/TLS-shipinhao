[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
tauri = { workspace = true, features = [] }
desktop-services = { path = "../../backend/crates/desktop-services" }
domain-core = { path = "../../backend/crates/domain-core" }
api-contracts = { path = "../../backend/crates/api-contracts" }
license-service = { path = "../../backend/crates/license-service" }
security_core = { path = "../../backend/crates/security-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
rusqlite = { workspace = true }
dirs = "6"
rfd = "0.15"
keyring = "3"
aes-gcm = "0.10"
rand = "0.8"

[dev-dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
tempfile = "3"
