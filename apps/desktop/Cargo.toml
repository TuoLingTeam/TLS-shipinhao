[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
tauri = { workspace = true, features = [] }
desktop-services = { path = "../../crates/desktop-services" }
domain-core = { path = "../../crates/domain-core" }
api-contracts = { path = "../../backend/api-contracts" }
license-service = { path = "../../backend/license-service" }
security_core = { path = "../../crates/security-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# 启 json feature 给 security-events.jsonl 安全事件文件用 JSON Lines 格式输出
tracing-subscriber = { workspace = true, features = ["json"] }
# 安全事件文件 writer 走 non-blocking 通道，避免 emit 阻塞授权关键路径
tracing-appender = "0.2"
chrono = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
rusqlite = { workspace = true }
# B3 LeaseVerifier 哨兵需要在 release 主路径上构造 base64url(s)，因此
# 从 dev-dependencies 提升到主依赖。版本与 license-service 系列内部使用
# 的 base64 0.22 对齐，编译产物不会因此重复链接。
base64 = "0.22"
dirs = "6"
rfd = "0.15"
keyring = "3"
aes-gcm = "0.10"
rand = "0.8"
obfstr = { workspace = true }

[dev-dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }
