name = "tls-shipinhao-license-worker"
main = "build/worker/shim.mjs"
compatibility_date = "2024-12-01"
workers_dev = false

[build]
command = "cargo install -q worker-build >/dev/null 2>&1 || true && worker-build --release"

routes = [
  { pattern = "sphapi.199908.top/*", zone_name = "199908.top" }
]

[vars]
# HMAC_SECRET / ADMIN_SECRET / LICENSE_SIGNING_PRIVATE_KEY_B64 通过 wrangler secret put 设置

[[d1_databases]]
binding = "DB"
database_name = "tls-license-db"
database_id = "dc9a0ef0-26b5-4738-9863-729a64c74a27"
