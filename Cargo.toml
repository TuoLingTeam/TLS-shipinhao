[workspace]
resolver = "2"
members = [
  "backend/api-contracts",
  "backend/license-service",
  "backend/license-worker",
  "apps/desktop/crates/domain-core",
  "apps/desktop/crates/security-core",
  "apps/desktop/crates/desktop-services",
  "scripts/build-tools",
  "scripts/xtask",
  "apps/desktop",
]

[workspace.package]
edition = "2021"
version = "5.0.3"
license = "Proprietary"
authors = ["TLS-801"]

# workspace 级 lint 框架（Rust 1.74+）。各成员 crate 在自己的 Cargo.toml 加
# [lints] workspace = true 即可继承本段配置；当前阶段我们只把 rustc 与 clippy
# 的部分默认 warn 显式化作为「事实源」，确保后续渐进加严时只改本处即可。
#
# 升级策略：
# 1. 任何新启用的 deny 级 lint 必须先在所有现成 crate 上跑通（pnpm lint:rust）
# 2. 新 crate 默认 [lints] workspace = true，必要时显式 allow
# 3. 风险大的 clippy::pedantic 子集（如 unwrap_used）暂保持默认 allow，等
#    专项 PR 收敛 unwrap 后再升级
[workspace.lints.rust]
unused_imports = "warn"
dead_code = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# 维持默认严格度，仅显式开几个高信噪比项；继续不开 pedantic / nursery / restriction
# 大类，避免一次性引入海量 warning 把 CI -D warnings 直接打红。
needless_borrow = "warn"
redundant_clone = "warn"
unnecessary_wraps = "warn"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
# release 构建下通过 compile-time max level off 剥掉 tracing 宏扩展出的 file/line 静态元数据，
# 避免 strings 扫出 apps/desktop/src/...rs 形态（与 -Z location-detail=none 互补：后者只管 panic/caller）
tracing = { version = "0.1", default-features = false, features = ["std", "release_max_level_off"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = ["full"] }
tauri = { version = "2" }
tauri-build = { version = "2" }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
# 编译期字符串加密：用 obfstr!("...") 包装关键明文（URL / API 路径 / 卡密报错），
# release 产物中 `strings` 扫不出原文，逆向需要还原解密过程
obfstr = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
# 路径字面量：发版脚本 `scripts/build-release.mjs` 会合并 RUSTFLAGS 的
# `-C remap-path-prefix=...`（工作区 / CARGO_HOME / RUSTUP_HOME），与下述 panic/tracing 策略叠加。
# 可选：环境变量 `TLS_RELEASE_RUSTFLAGS` 追加 nightly 标志（如 `-Zlocation-detail=none`）。
# 去掉 panic unwind 表 + panic 字符串，进一步缩小可被分析的字面量面
panic = "abort"
# 关闭 release 下的溢出断言，避免留下检测分支字符串
overflow-checks = false
# 确保不写入任何 DWARF 调试信息（strip=true 会再清一次，双保险）
debug = 0
# 禁用 debug-assertions（RUST_BACKTRACE 也受此影响，逆向信息更少）
debug-assertions = false
