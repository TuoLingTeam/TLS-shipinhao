name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            artifact_name: tls-shipinhao-macos
            artifact_path: dist/TLS-shipinhao.app
          - os: windows-latest
            label: Windows
            artifact_name: tls-shipinhao-windows
            artifact_path: dist/TLS-shipinhao.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install PySide6 pyinstaller charset_normalizer
        shell: bash

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh
        shell: bash

      - name: Build Windows app
        if: runner.os == 'Windows'
        run: .\build_windows.bat
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
