name: Build Desktop Apps

on:
  # 手动触发时，按开关选择构建平台。
  workflow_dispatch:
    inputs:
      build_macos:
        description: Build macOS app
        required: true
        default: false
        type: boolean
      build_windows:
        description: Build Windows app
        required: true
        default: true
        type: boolean
  # 日常分支活动默认只跑 macOS。
  push:
    branches:
      - main
  pull_request:

jobs:
  build-macos:
    name: Build macOS
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_macos }}
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pyinstaller

      - name: Build macOS app
        shell: bash
        run: python scripts/build.py macos

      - name: Package macOS app bundle
        shell: bash
        run: |
          rm -f dist/tls-shipinhao-macos.zip
          ditto -c -k --sequesterRsrc --keepParent dist/TLS-shipinhao.app dist/tls-shipinhao-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tls-shipinhao-macos
          path: dist/tls-shipinhao-macos.zip
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_windows }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }
          python -m pip install pyinstaller

      - name: Build Windows app
        shell: pwsh
        run: python scripts/build.py windows

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tls-shipinhao-windows
          path: dist/TLS-shipinhao.exe
          if-no-files-found: error
          retention-days: 14
