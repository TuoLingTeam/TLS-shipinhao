name: Build Desktop Apps

on:
  # 手动触发时，支持按开关选择构建平台。
  workflow_dispatch:
    inputs:
      build_macos:
        description: Build macOS app
        required: true
        default: false
        type: boolean
      build_windows:
        description: Build Windows app
        required: true
        default: true
        type: boolean
  # 日常分支活动默认只跑 macOS，避免不必要消耗。
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    # 触发策略：
    # 1) push / PR：只构建 macOS；
    # 2) workflow_dispatch：按输入开关决定是否构建对应平台。
    if: >-
      ${{
        (github.event_name != 'workflow_dispatch' && matrix.target == 'macos') ||
        (github.event_name == 'workflow_dispatch' &&
          ((matrix.target == 'macos' && inputs.build_macos) ||
           (matrix.target == 'windows' && inputs.build_windows)))
      }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-latest
            target: macos
            artifact_name: tls-shipinhao-macos
            artifact_path: dist/tls-shipinhao-macos.zip
            pip_cache_path: |
              ~/.cache/pip
              ~/Library/Caches/pip
          - label: Windows
            os: windows-latest
            target: windows
            artifact_name: tls-shipinhao-windows
            artifact_path: dist/TLS-shipinhao.exe
            pip_cache_path: ~\AppData\Local\pip\Cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ${{ matrix.pip_cache_path }}
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (macOS)
        if: matrix.target == 'macos'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pyinstaller

      - name: Install dependencies (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }
          python -m pip install pyinstaller

      - name: Build app (macOS)
        if: matrix.target == 'macos'
        shell: bash
        run: python scripts/build.py macos

      - name: Build app (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: python scripts/build.py windows

      # macOS 产物按 .app 标准分发 zip，方便下载后直接使用。
      - name: Package macOS app bundle
        if: matrix.target == 'macos'
        shell: bash
        run: |
          rm -f dist/tls-shipinhao-macos.zip
          ditto -c -k --sequesterRsrc --keepParent dist/TLS-shipinhao.app dist/tls-shipinhao-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
