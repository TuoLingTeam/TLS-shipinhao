name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  GITEE_REPO_URL: https://gitee.com/tuolingshe/tuoling-shipinhao.git
  GITEE_RAW_BASE: https://gitee.com/tuolingshe/tuoling-shipinhao/raw/master

jobs:
  extract-version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import os

          text = Path('app/settings.py').read_text(encoding='utf-8')
          match = re.search(r'APP_VERSION\s*=\s*["\']([^"\']+)["\']', text)
          version = match.group(1).strip() if match else '0.0.0'
          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as fh:
              fh.write(f'app_version={version}\n')
              fh.write(f'release_tag=v{version}\n')
          PY

  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    needs: extract-version
    permissions:
      contents: write

    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.extract-version.outputs.release_tag }}'
          gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --notes "Automated desktop build for $tag."

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [extract-version, prepare-release]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt
          python -m pip install cython setuptools

      - name: Obfuscate code
        shell: pwsh
        run: python scripts/obfuscate.py

      - name: Build Windows app
        shell: pwsh
        run: python scripts/build.py windows --dist

      - name: Upload Windows release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ needs.extract-version.outputs.app_version }}"
          $tag = "${{ needs.extract-version.outputs.release_tag }}"
          $assetName = "TLS-shipinhao-v$version-windows.zip"
          $assetPath = "dist/TLS-shipinhao-win.zip"

          gh release upload $tag "$assetPath#$assetName" `
            --repo "${{ github.repository }}" `
            --clobber

      - name: Summarize Windows release upload
        if: ${{ always() }}
        shell: pwsh
        run: |
          $version = "${{ needs.extract-version.outputs.app_version }}"
          $tag = "${{ needs.extract-version.outputs.release_tag }}"
          $releaseUrl = "https://github.com/${{ github.repository }}/releases/tag/$tag"
          @"
          已上传/更新 GitHub Release 资产：
          - 平台: Windows
          - Release: $tag
          - Asset: TLS-shipinhao-v$version-windows.zip
          - URL: $releaseUrl
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [extract-version, prepare-release]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt
          python -m pip install cython setuptools

      - name: Obfuscate code
        shell: bash
        run: python scripts/obfuscate.py

      - name: Build macOS app
        shell: bash
        run: python scripts/build.py mac --dist

      - name: Package macOS app bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -f dist/TLS-shipinhao-mac.zip
          ditto -c -k --sequesterRsrc --keepParent dist/TLS-shipinhao.app dist/TLS-shipinhao-mac.zip

      - name: Upload macOS release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version='${{ needs.extract-version.outputs.app_version }}'
          tag='${{ needs.extract-version.outputs.release_tag }}'
          asset_name="TLS-shipinhao-v${version}-mac.zip"
          asset_path='dist/TLS-shipinhao-mac.zip'

          gh release upload "$tag" "$asset_path#$asset_name" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Summarize macOS release upload
        if: ${{ always() }}
        shell: bash
        run: |
          tag='${{ needs.extract-version.outputs.release_tag }}'
          version='${{ needs.extract-version.outputs.app_version }}'
          release_url="https://github.com/${{ github.repository }}/releases/tag/$tag"
          {
            echo '已上传/更新 GitHub Release 资产：'
            echo '- 平台: macOS'
            echo "- Release: $tag"
            echo "- Asset: TLS-shipinhao-v${version}-mac.zip"
            echo "- URL: $release_url"
          } >> "$GITHUB_STEP_SUMMARY"

  sync-gitee:
    name: Sync Release Assets To Gitee
    runs-on: ubuntu-latest
    needs: [extract-version, prepare-release, build-windows, build-macos]

    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-assets
          gh release download "${{ needs.extract-version.outputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --dir /tmp/release-assets

          echo "已下载 Release 资产："
          ls -la /tmp/release-assets

      - name: Locate Mac and Windows zip assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          assets_dir = Path('/tmp/release-assets')
          files = [p for p in assets_dir.iterdir() if p.is_file()]

          mac_candidates = [p for p in files if p.suffix.lower() == '.zip' and 'mac' in p.name.lower()]
          win_candidates = [p for p in files if p.suffix.lower() == '.zip' and ('windows' in p.name.lower() or 'win' in p.name.lower())]

          if not mac_candidates:
              raise SystemExit('未找到 Mac zip 资产，请确保 Release 中包含带 mac 字样的 zip 文件。')
          if not win_candidates:
              raise SystemExit('未找到 Windows zip 资产，请确保 Release 中包含带 windows/win 字样的 zip 文件。')

          mac_asset = sorted(mac_candidates)[0]
          win_asset = sorted(win_candidates)[0]

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'mac_asset={mac_asset}\n')
              fh.write(f'win_asset={win_asset}\n')
          PY

      - name: Clone Gitee update repo
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GITEE_USERNAME}" || -z "${GITEE_TOKEN}" ]]; then
            echo "请先在 GitHub Secrets 中配置 GITEE_USERNAME 和 GITEE_TOKEN。" >&2
            exit 1
          fi
          git clone --depth 1 "https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/tuolingshe/tuoling-shipinhao.git" /tmp/gitee-sync-repo

      - name: Upload release assets to Gitee Release and rewrite version.json
        id: gitee_release
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: tuolingshe
          GITEE_REPO: tuoling-shipinhao
          RELEASE_TAG: ${{ needs.extract-version.outputs.release_tag }}
          VERSION: ${{ needs.extract-version.outputs.app_version }}
          BUILD_DATE: ${{ github.run_number }}
          MAC_ASSET: ${{ steps.assets.outputs.mac_asset }}
          WIN_ASSET: ${{ steps.assets.outputs.win_asset }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import requests

          token = os.environ['GITEE_TOKEN']
          owner = os.environ['GITEE_OWNER']
          repo = os.environ['GITEE_REPO']
          tag = os.environ['RELEASE_TAG']
          version = os.environ['VERSION']
          build_date = int(os.environ['BUILD_DATE'])
          mac_asset = Path(os.environ['MAC_ASSET'])
          win_asset = Path(os.environ['WIN_ASSET'])
          output_path = Path(os.environ['GITHUB_OUTPUT'])
          version_file = Path('/tmp/gitee-sync-repo/version.json')
          session = requests.Session()
          session.headers.update({'Accept': 'application/json'})
          api_base = f'https://gitee.com/api/v5/repos/{owner}/{repo}'

          def request(method, url, **kwargs):
              params = kwargs.pop('params', {}) or {}
              data = kwargs.pop('data', None)
              files = kwargs.pop('files', None)
              if files is None:
                  if data is None:
                      data = {}
                  data.setdefault('access_token', token)
              else:
                  params.setdefault('access_token', token)
              response = session.request(method, url, params=params, data=data, files=files, timeout=180, **kwargs)
              response.raise_for_status()
              return response.json() if response.text else None

          releases = request('GET', f'{api_base}/releases', params={'access_token': token, 'per_page': 100})
          release = next((item for item in releases if item.get('tag_name') == tag), None)
          if release is None:
              payload = {
                  'tag_name': tag,
                  'name': tag,
                  'body': f'Automated sync for {tag}',
                  'target_commitish': 'master',
                  'prerelease': 'false',
              }
              release = request('POST', f'{api_base}/releases', data=payload)

          release_id = release['id']
          existing_files = request('GET', f'{api_base}/releases/{release_id}/attach_files', params={'access_token': token, 'per_page': 100}) or []
          existing_by_name = {item.get('name'): item for item in existing_files}

          def upload_asset(file_path: Path, target_name: str) -> str:
              existing = existing_by_name.get(target_name)
              if existing is not None:
                  attach_id = existing.get('id')
                  if attach_id:
                      request('DELETE', f'{api_base}/releases/{release_id}/attach_files/{attach_id}', params={'access_token': token})
              with file_path.open('rb') as fh:
                  uploaded = request(
                      'POST',
                      f'{api_base}/releases/{release_id}/attach_files',
                      files={'file': (target_name, fh, 'application/zip')},
                  )
              url = uploaded.get('browser_download_url') or uploaded.get('download_url') or uploaded.get('url')
              if not url:
                  raise RuntimeError(f'Gitee 附件上传成功，但未返回下载地址: {target_name}')
              return url

          mac_name = f'TLS-shipinhao-{version}-mac.zip'
          win_name = f'TLS-shipinhao-{version}-win.zip'
          mac_url = upload_asset(mac_asset, mac_name)
          win_url = upload_asset(win_asset, win_name)

          payload = {
              'app': 'TLS-shipinhao',
              'version': version,
              'build': build_date,
              'mandatory': False,
              'mac': {'url': mac_url},
              'windows': {'url': win_url},
          }
          version_file.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          with output_path.open('a', encoding='utf-8') as fh:
              fh.write(f'mac_url={mac_url}\n')
              fh.write(f'win_url={win_url}\n')
          PY

      - name: Commit and push version.json to Gitee
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.extract-version.outputs.release_tag }}
        run: |
          set -euo pipefail
          cd /tmp/gitee-sync-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --cached --quiet; then
            echo "version.json 没有需要同步的变更。"
            exit 0
          fi
          git commit -m "更新 ${RELEASE_TAG} 的 version.json"
          git push origin master

      - name: Summarize Gitee sync result
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '### Gitee 同步结果'
            echo "- Tag: ${{ needs.extract-version.outputs.release_tag }}"
            echo "- Version: ${{ needs.extract-version.outputs.app_version }}"
            echo "- Mac 资产: ${{ steps.assets.outputs.mac_asset || '未解析' }}"
            echo "- Windows 资产: ${{ steps.assets.outputs.win_asset || '未解析' }}"
            echo "- Gitee 仓库: ${{ env.GITEE_REPO_URL }}"
            echo "- Gitee Mac 下载: ${{ steps.gitee_release.outputs.mac_url || '未上传' }}"
            echo "- Gitee Windows 下载: ${{ steps.gitee_release.outputs.win_url || '未上传' }}"
            echo "- version.json: ${{ env.GITEE_RAW_BASE }}/version.json"
          } >> "$GITHUB_STEP_SUMMARY"
