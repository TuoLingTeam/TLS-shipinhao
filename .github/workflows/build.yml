name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      artifact_cache_key: ${{ steps.cache_key.outputs.key }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt
          python -m pip install cython setuptools

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $raw = Get-Content -Path 'app/src/constants.py' -Raw
          if ($raw -notmatch 'APP_VERSION\s*=\s*"([^"]+)"') {
            $version = '0.0'
          } else {
            $version = $Matches[1].Trim()
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "app_version=$version"

      - name: Compute artifact cache key
        id: cache_key
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_OUTPUT -Value "key=windows-dist-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Obfuscate code
        shell: pwsh
        run: python app/scripts/obfuscate.py

      - name: Build Windows app
        shell: pwsh
        run: python app/scripts/build.py windows --dist

      - name: Save build archive to cache
        uses: actions/cache/save@v4
        with:
          path: dist/TLS-shipinhao-win.zip
          key: ${{ steps.cache_key.outputs.key }}

  upload-windows-artifact:
    name: Upload Windows Artifact
    runs-on: windows-latest
    needs: build-windows
    if: ${{ always() && needs.build-windows.result == 'success' }}
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore build archive from cache
        uses: actions/cache/restore@v4
        with:
          path: dist/TLS-shipinhao-win.zip
          key: ${{ needs.build-windows.outputs.artifact_cache_key }}
          fail-on-cache-miss: true

      - name: Upload artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: TLS-shipinhao-v${{ needs.build-windows.outputs.app_version }}-windows
          path: dist/TLS-shipinhao-win.zip
          if-no-files-found: error
          retention-days: 30

      - name: Summarize artifact upload failure
        if: ${{ always() && steps.upload_artifact.outcome == 'failure' }}
        shell: pwsh
        run: |
          @"
          Artifact 上传失败，但构建已完成，工作流不会因此整体失败。
          可在配额恢复后单独重跑当前 Upload Windows Artifact job。
          当前缓存键：${{ needs.build-windows.outputs.artifact_cache_key }}
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
