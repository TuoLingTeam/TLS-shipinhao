name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt
          python -m pip install cython setuptools

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import re; m = re.search(r'APP_VERSION\s*=\s*[`\`"'\'']([^`\`"'\'']+)[`\`"'\'']', (Get-Content app/src/constants.py -Raw)); print(m.group(1) if m else '0.0')"
          echo "app_version=$version" >> $env:GITHUB_OUTPUT

      - name: Obfuscate code
        shell: pwsh
        run: python app/scripts/obfuscate.py

      - name: Build Windows app
        shell: pwsh
        run: python app/scripts/build.py windows --dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TLS-shipinhao-v${{ steps.version.outputs.app_version }}-windows
          path: dist/TLS-shipinhao-win.zip
          if-no-files-found: error
          retention-days: 30
