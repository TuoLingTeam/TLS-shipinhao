name: Rust Desktop Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'crates/**'
      - 'apps/**'
      - 'xtask/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

env:
  APP_NAME: TLS-shipinhao

jobs:
  extract-version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract workspace version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '
            $0 ~ /^\[workspace.package\]$/ { in_section=1; next }
            in_section && $0 ~ /^\[/ { in_section=0 }
            in_section && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          test -n "$version"
          {
            echo "app_version=$version"
            echo "release_tag=v$version"
          } >> "$GITHUB_OUTPUT"

  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    needs: extract-version
    permissions:
      contents: write

    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.extract-version.outputs.release_tag }}'
          gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --notes "Rust desktop release for $tag."

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [extract-version, prepare-release]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        shell: pwsh
        run: cargo test --workspace

      - name: Build desktop app
        shell: pwsh
        run: cargo run -p xtask -- desktop-build --release

      - name: Generate integrity manifest
        shell: pwsh
        env:
          INTEGRITY_MANIFEST_PRIVATE_KEY_B64: ${{ secrets.INTEGRITY_MANIFEST_PRIVATE_KEY_B64 }}
          INTEGRITY_MANIFEST_KEY_ID: manifest-v1
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          cargo run -p xtask -- manifest target/release dist/integrity-manifest-windows.json desktop-app.exe

      - name: Package Windows release asset
        shell: pwsh
        run: |
          $version = "${{ needs.extract-version.outputs.app_version }}"
          $zipPath = "dist/TLS-shipinhao-v$version-windows.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path target/release/desktop-app.exe, dist/integrity-manifest-windows.json -DestinationPath $zipPath

      - name: Upload Windows release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ needs.extract-version.outputs.release_tag }}"
          $version = "${{ needs.extract-version.outputs.app_version }}"
          gh release upload $tag "dist/TLS-shipinhao-v$version-windows.zip#TLS-shipinhao-v$version-windows.zip" `
            --repo "${{ github.repository }}" `
            --clobber

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [extract-version, prepare-release]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        shell: bash
        run: cargo test --workspace

      - name: Build desktop app
        shell: bash
        run: cargo run -p xtask -- desktop-build --release

      - name: Generate integrity manifest
        shell: bash
        env:
          INTEGRITY_MANIFEST_PRIVATE_KEY_B64: ${{ secrets.INTEGRITY_MANIFEST_PRIVATE_KEY_B64 }}
          INTEGRITY_MANIFEST_KEY_ID: manifest-v1
        run: |
          set -euo pipefail
          mkdir -p dist
          cargo run -p xtask -- manifest target/release dist/integrity-manifest-macos.json desktop-app

      - name: Package macOS release asset
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.extract-version.outputs.app_version }}'
          zip_path="dist/TLS-shipinhao-v${version}-mac.zip"
          rm -f "$zip_path"
          ditto -c -k --keepParent target/release/desktop-app "$zip_path"
          ditto -c -k --keepParent dist/integrity-manifest-macos.json dist/integrity-manifest-macos.zip
          zip -j "$zip_path" dist/integrity-manifest-macos.json

      - name: Upload macOS release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ needs.extract-version.outputs.release_tag }}'
          version='${{ needs.extract-version.outputs.app_version }}'
          gh release upload "$tag" "dist/TLS-shipinhao-v${version}-mac.zip#TLS-shipinhao-v${version}-mac.zip" \
            --repo "${{ github.repository }}" \
            --clobber
