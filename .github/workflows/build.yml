name: Build Windows App

on:
  # 手动触发构建Windows版本
  workflow_dispatch:
    inputs:
      use_obfuscation:
        description: Use code obfuscation (Cython)
        required: true
        default: true
        type: boolean
  # 推送到main分支时自动构建Windows版本
  push:
    branches:
      - main
  pull_request:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('app/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path app/requirements.txt) {
            python -m pip install -r app/requirements.txt
          }
          python -m pip install pyinstaller cython setuptools

      - name: Obfuscate code
        shell: pwsh
        run: python app/scripts/obfuscate.py

      - name: Build Windows app
        shell: pwsh
        run: python app/scripts/build.py windows --dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tls-shipinhao-windows
          path: dist/TLS-shipinhao.exe
          if-no-files-found: error
          retention-days: 14
