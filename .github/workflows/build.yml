name: Tauri Desktop Release

# 仅在以下两种情况触发桌面构建（Windows + macOS runner 成本高，按分钟 2× / 10× 扣费）：
#   1. 打 tag `v*`（推荐方式：`git tag v5.2.0 && git push --tags`，默认仅产出 Windows 便携包）
#   2. 手动 workflow_dispatch 触发
# 日常 push main 不再触发 Desktop 构建，改由开发者本地验证；发版时打 tag 集中构建。

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: '是否启用 macOS 构建（默认关闭以节省资源）'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  APP_NAME: TLS-shipinhao
  # 与 https://github.com/tauri-apps/tauri/releases?q=tauri-cli 的 tag（tauri-cli-v*）对齐，避免 cargo install 在 Windows 上长时间编译
  TAURI_CLI_VERSION: "2.10.1"

jobs:
  extract-version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract workspace version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '
            $0 ~ /^\[workspace.package\]$/ { in_section=1; next }
            in_section && $0 ~ /^\[/ { in_section=0 }
            in_section && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          test -n "$version"
          # tag 触发时用 tag 名（可能带 -diag、-rc 等后缀）创建独立 release；
          # workflow_dispatch 时回退到 v<workspace version>，保持原行为
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="v${version}"
          fi
          {
            echo "app_version=$version"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter tls-shipinhao-ui build

      - name: Rust format check
        run: cargo fmt --all --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

      # L4-5：`cargo audit` 用 RustSec advisory db。传递依赖 / 未修复条目
      # 会间歇性出现；若改为阻塞，主干易被外部数据库更新「误伤」。
      # 因此保持 `continue-on-error: true`，由维护者定期读日志并升级；
      # 若连续多周 `cargo audit` 均为 0 vuln，再移除 continue-on-error。
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
        continue-on-error: true

      - name: Cargo audit (non-blocking)
        run: cargo audit
        continue-on-error: true

  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    needs: [extract-version, test]
    permissions:
      contents: write

    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.extract-version.outputs.release_tag }}'
          gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --notes "Tauri desktop release for $tag."

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [extract-version, prepare-release]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI (prebuilt)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ env.TAURI_CLI_VERSION }}"
          $tag = "tauri-cli-v$version"
          $zip = "cargo-tauri-x86_64-pc-windows-msvc.zip"
          $url = "https://github.com/tauri-apps/tauri/releases/download/$tag/$zip"
          $outDir = Join-Path $env:GITHUB_WORKSPACE ".tools/cargo-tauri"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $zipPath = Join-Path $outDir $zip
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $outDir -Force
          $exe = Get-ChildItem -Path $outDir -Filter "cargo-tauri.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "cargo-tauri.exe not found under $outDir" }
          $binDir = $exe.DirectoryName
          Add-Content $env:GITHUB_PATH $binDir
          $env:PATH = "$binDir;$env:PATH"
          cargo tauri --version

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build deep-obfuscated release (mirror + JS obfuscate + cargo tauri build)
        shell: pwsh
        env:
          # CI 专用 release profile 覆盖：本地 Cargo.toml 保持 lto=true / codegen-units=1 的最高优化；
          # CI 改用 thin LTO + 16 codegen-units，显著压缩 Windows 编译时间，产物体积略增但无大影响。
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          # Windows 发布仅需便携包，跳过 bundle（NSIS/MSI）以节省构建资源。
          TLS_TAURI_NO_BUNDLE: "1"
        run: node scripts/build-obfuscate.mjs

      - name: Upload Windows obfuscated dist (diag)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-obfuscated-dist
          path: TLS-shipinhao-release/apps/ui/dist/**
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Windows portable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ needs.extract-version.outputs.release_tag }}"
          $version = "${{ needs.extract-version.outputs.app_version }}"
          # 深混脚本 build-obfuscate.mjs 会把产物统一收集到 dist/release/
          # Windows 仅分发便携包。
          $portable = Get-ChildItem -Path "dist/release/*portable*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $portable) {
            # 兜底：--no-bundle 下主程序会直接输出 desktop.exe
            $portable = Get-ChildItem -Path "TLS-shipinhao-release/target/release/desktop.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($portable) {
            gh release upload $tag "$($portable.FullName)#TLS-shipinhao-v$version.exe" `
              --repo "${{ github.repository }}" --clobber
          } else {
            throw "Windows portable exe not found under dist/release/ or TLS-shipinhao-release/target/release/"
          }

  build-macos:
    name: Build macOS
    # 保留 macOS 构建配置，但默认关闭：仅手动触发且显式开启时运行。
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_macos == true }}
    runs-on: macos-latest
    needs: [extract-version, prepare-release]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI (prebuilt)
        shell: bash
        run: |
          set -euo pipefail
          version="${TAURI_CLI_VERSION}"
          tag="tauri-cli-v${version}"
          arch="$(uname -m)"
          case "${arch}" in
            arm64) zip="cargo-tauri-aarch64-apple-darwin.zip" ;;
            x86_64) zip="cargo-tauri-x86_64-apple-darwin.zip" ;;
            *) echo "unsupported arch: ${arch}"; exit 1 ;;
          esac
          url="https://github.com/tauri-apps/tauri/releases/download/${tag}/${zip}"
          out_dir="${GITHUB_WORKSPACE}/.tools/cargo-tauri"
          mkdir -p "${out_dir}"
          echo "Downloading ${url}"
          curl -fsSL "${url}" -o "${out_dir}/${zip}"
          unzip -o "${out_dir}/${zip}" -d "${out_dir}"
          bin="$(find "${out_dir}" -name cargo-tauri -type f | head -1)"
          test -n "${bin}"
          chmod +x "${bin}"
          echo "$(dirname "${bin}")" >> "${GITHUB_PATH}"
          export PATH="$(dirname "${bin}"):${PATH}"
          cargo tauri --version

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build deep-obfuscated release (mirror + JS obfuscate + cargo tauri build)
        shell: bash
        env:
          # CI 专用 release profile 覆盖：与 Windows 同策略，本地 Cargo.toml 仍保持最高优化
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: node scripts/build-obfuscate.mjs

      - name: Upload macOS obfuscated dist (diag)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-obfuscated-dist
          path: TLS-shipinhao-release/apps/ui/dist/**
          retention-days: 7
          if-no-files-found: warn

      - name: Upload macOS asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ needs.extract-version.outputs.release_tag }}'
          version='${{ needs.extract-version.outputs.app_version }}'
          # 深混脚本会把 dmg 收集到 dist/release/；兜底再查镜像 bundle 目录
          dmg=$(find dist/release -name '*.dmg' 2>/dev/null | head -1)
          if [ -z "$dmg" ]; then
            dmg=$(find TLS-shipinhao-release/target/release/bundle/dmg -name '*.dmg' 2>/dev/null | head -1)
          fi
          if [ -n "$dmg" ]; then
            gh release upload "$tag" "${dmg}#TLS-shipinhao-v${version}-mac.dmg" \
              --repo "${{ github.repository }}" --clobber
          else
            echo "dmg not found in dist/release/ nor TLS-shipinhao-release/target/release/bundle/dmg" >&2
            exit 1
          fi
