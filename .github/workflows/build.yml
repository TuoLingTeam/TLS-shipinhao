name: Tauri Desktop Release

# 仅在以下两种情况触发桌面构建（Windows + macOS runner 成本高，按分钟 2× / 10× 扣费）：
#   1. 打 tag `v*`（推荐方式：`git tag v5.2.0 && git push --tags` 一次性产出两平台安装包）
#   2. 手动 workflow_dispatch 触发
# 日常 push main 不再触发 Desktop 构建，改由开发者本地验证；发版时打 tag 集中构建。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  APP_NAME: TLS-shipinhao
  # 与 https://github.com/tauri-apps/tauri/releases?q=tauri-cli 的 tag（tauri-cli-v*）对齐，避免 cargo install 在 Windows 上长时间编译
  TAURI_CLI_VERSION: "2.10.1"

jobs:
  extract-version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract workspace version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '
            $0 ~ /^\[workspace.package\]$/ { in_section=1; next }
            in_section && $0 ~ /^\[/ { in_section=0 }
            in_section && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          test -n "$version"
          {
            echo "app_version=$version"
            echo "release_tag=v$version"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter tls-shipinhao-ui build

      - name: Run Rust tests
        run: cargo test --workspace

  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    needs: [extract-version, test]
    permissions:
      contents: write

    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.extract-version.outputs.release_tag }}'
          gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --notes "Tauri desktop release for $tag."

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [extract-version, prepare-release]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI (prebuilt)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ env.TAURI_CLI_VERSION }}"
          $tag = "tauri-cli-v$version"
          $zip = "cargo-tauri-x86_64-pc-windows-msvc.zip"
          $url = "https://github.com/tauri-apps/tauri/releases/download/$tag/$zip"
          $outDir = Join-Path $env:GITHUB_WORKSPACE ".tools/cargo-tauri"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $zipPath = Join-Path $outDir $zip
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $outDir -Force
          $exe = Get-ChildItem -Path $outDir -Filter "cargo-tauri.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "cargo-tauri.exe not found under $outDir" }
          $binDir = $exe.DirectoryName
          Add-Content $env:GITHUB_PATH $binDir
          $env:PATH = "$binDir;$env:PATH"
          cargo tauri --version

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build obfuscated release (frontend obfuscate + cargo tauri build)
        shell: pwsh
        env:
          # CI 专用 release profile 覆盖：本地 Cargo.toml 保持 lto=true / codegen-units=1 的最高优化；
          # CI 改用 thin LTO + 16 codegen-units，显著压缩 Windows 编译时间，产物体积略增但无大影响。
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: node scripts/build-release.mjs

      - name: Upload Windows portable exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ needs.extract-version.outputs.release_tag }}"
          $version = "${{ needs.extract-version.outputs.app_version }}"
          # Tauri Rust 编译的原生 exe 位于 target/release/desktop.exe
          # Windows 10/11 自带 WebView2 Runtime 时可双击直接运行，无需安装
          $portable = Get-ChildItem -Path "target/release/desktop.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $portable) {
            $portable = Get-ChildItem -Path "target/release/*.exe" -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notlike "*_deps*" -and $_.Name -notlike "build-*" -and $_.Name -notmatch "^(cargo|rustc)" } |
              Select-Object -First 1
          }
          if ($portable) {
            gh release upload $tag "$($portable.FullName)#TLS-shipinhao-v$version-portable.exe" `
              --repo "${{ github.repository }}" --clobber
          } else {
            throw "Portable exe not found under target/release/"
          }

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [extract-version, prepare-release]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI (prebuilt)
        shell: bash
        run: |
          set -euo pipefail
          version="${TAURI_CLI_VERSION}"
          tag="tauri-cli-v${version}"
          arch="$(uname -m)"
          case "${arch}" in
            arm64) zip="cargo-tauri-aarch64-apple-darwin.zip" ;;
            x86_64) zip="cargo-tauri-x86_64-apple-darwin.zip" ;;
            *) echo "unsupported arch: ${arch}"; exit 1 ;;
          esac
          url="https://github.com/tauri-apps/tauri/releases/download/${tag}/${zip}"
          out_dir="${GITHUB_WORKSPACE}/.tools/cargo-tauri"
          mkdir -p "${out_dir}"
          echo "Downloading ${url}"
          curl -fsSL "${url}" -o "${out_dir}/${zip}"
          unzip -o "${out_dir}/${zip}" -d "${out_dir}"
          bin="$(find "${out_dir}" -name cargo-tauri -type f | head -1)"
          test -n "${bin}"
          chmod +x "${bin}"
          echo "$(dirname "${bin}")" >> "${GITHUB_PATH}"
          export PATH="$(dirname "${bin}"):${PATH}"
          cargo tauri --version

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build obfuscated release (frontend obfuscate + cargo tauri build)
        shell: bash
        env:
          # CI 专用 release profile 覆盖：与 Windows 同策略，本地 Cargo.toml 仍保持最高优化
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: node scripts/build-release.mjs

      - name: Upload macOS asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ needs.extract-version.outputs.release_tag }}'
          version='${{ needs.extract-version.outputs.app_version }}'
          dmg=$(find target/release/bundle/dmg -name '*.dmg' 2>/dev/null | head -1)
          if [ -n "$dmg" ]; then
            gh release upload "$tag" "${dmg}#TLS-shipinhao-v${version}-mac.dmg" \
              --repo "${{ github.repository }}" --clobber
          fi
