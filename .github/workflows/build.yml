name: Tauri Desktop Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'crates/**'
      - 'apps/**'
      - 'ui/**'
      - 'xtask/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

env:
  APP_NAME: TLS-shipinhao

jobs:
  extract-version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract workspace version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '
            $0 ~ /^\[workspace.package\]$/ { in_section=1; next }
            in_section && $0 ~ /^\[/ { in_section=0 }
            in_section && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          test -n "$version"
          {
            echo "app_version=$version"
            echo "release_tag=v$version"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter tls-shipinhao-ui build

      - name: Run Rust tests
        run: cargo test --workspace

  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    needs: [extract-version, test]
    permissions:
      contents: write

    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.extract-version.outputs.release_tag }}'
          gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --notes "Tauri desktop release for $tag."

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [extract-version, prepare-release]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        shell: pwsh
        run: cargo tauri build
        working-directory: apps/desktop

      - name: Upload Windows asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ needs.extract-version.outputs.release_tag }}"
          $version = "${{ needs.extract-version.outputs.app_version }}"
          $nsis = Get-ChildItem -Path "target/release/bundle/nsis/*.exe" -Recurse | Select-Object -First 1
          if ($nsis) {
            gh release upload $tag "$($nsis.FullName)#TLS-shipinhao-v$version-setup.exe" `
              --repo "${{ github.repository }}" --clobber
          }

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [extract-version, prepare-release]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        shell: bash
        run: cargo tauri build
        working-directory: apps/desktop

      - name: Upload macOS asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ needs.extract-version.outputs.release_tag }}'
          version='${{ needs.extract-version.outputs.app_version }}'
          dmg=$(find target/release/bundle/dmg -name '*.dmg' 2>/dev/null | head -1)
          if [ -n "$dmg" ]; then
            gh release upload "$tag" "${dmg}#TLS-shipinhao-v${version}-mac.dmg" \
              --repo "${{ github.repository }}" --clobber
          fi
