name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt
          python -m pip install cython setuptools

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $raw = Get-Content -Path 'app/src/constants.py' -Raw
          if ($raw -notmatch 'APP_VERSION\s*=\s*"([^"]+)"') {
            $version = '0.0'
          } else {
            $version = $Matches[1].Trim()
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "app_version=$version"

      - name: Obfuscate code
        shell: pwsh
        run: python app/scripts/obfuscate.py

      - name: Build Windows app
        shell: pwsh
        run: python app/scripts/build.py windows --dist

      - name: Publish versioned release asset
        id: publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.app_version }}"
          $tag = "v$version"
          $assetName = "TLS-shipinhao-v$version-windows.zip"
          $assetPath = "dist/TLS-shipinhao-win.zip"

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo "${{ github.repository }}" `
              --title $tag `
              --notes "Automated Windows build for $tag."
          }

          gh release upload $tag "$assetPath#$assetName" `
            --repo "${{ github.repository }}" `
            --clobber

      - name: Summarize release upload
        if: ${{ always() }}
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.app_version }}"
          $tag = "v$version"
          $releaseUrl = "https://github.com/${{ github.repository }}/releases/tag/$tag"
          if ("${{ steps.publish_release.outcome }}" -eq "success") {
            @"
          已上传/更新 GitHub Release 资产：
          - Release: $tag
          - Asset: TLS-shipinhao-v$version-windows.zip
          - URL: $releaseUrl
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            @"
          GitHub Release 资产上传失败。
          目标 Release: $tag
          预期资产名：TLS-shipinhao-v$version-windows.zip
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
