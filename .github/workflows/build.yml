name: Build Windows App (Obfuscated)

on:
  # 手动触发构建Windows版本
  workflow_dispatch:
  # 只在推送到wuxinxi分支时自动构建Windows版本
  push:
    branches:
      - wuxinxi
  pull_request:
    branches:
      - wuxinxi

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('app/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path app-dist/requirements.txt) {
            python -m pip install -r app-dist/requirements.txt
          }
          python -m pip install pyinstaller

      - name: Build Windows app from obfuscated code
        shell: pwsh
        run: |
          # 直接从混淆目录构建，不需要重新混淆
          cd app-dist
          pyinstaller --onefile --windowed --name "TLS-shipinhao" --icon="../build/app_icon.ico" main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tls-shipinhao-windows-obfuscated
          path: app-dist/dist/TLS-shipinhao.exe
          if-no-files-found: error
          retention-days: 14
