name: CI

# 轻量 CI：每次推送 main 都跑，仅在 Ubuntu 上跑 Rust 测试 + 前端构建校验。
# 目的：
#   1. 及早发现编译/类型错误
#   2. 不触发贵的 Windows / macOS runner（2×/10× 扣分钟），留给打 tag 再出 Desktop 安装包
#
# Desktop 构建产物（.exe / .dmg）由 .github/workflows/build.yml 在 push tag `v*` 或手动 dispatch 时产出

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'backend/**'
      - 'crates/**'
      - 'tools/**'
      - 'apps/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter tls-shipinhao-ui build

      - name: Run Rust tests
        run: cargo test --workspace
