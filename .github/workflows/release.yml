name: Release Pipeline

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (defaults to workspace version)
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          input_version='${{ github.event.inputs.version }}'
          if [ -n "$input_version" ]; then
            version="$input_version"
          else
            version=$(awk '
              $0 ~ /^\[workspace.package\]$/ { in_section=1; next }
              in_section && $0 ~ /^\[/ { in_section=0 }
              in_section && $1 == "version" {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.toml)
          fi
          echo "app_version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view '${{ steps.version.outputs.release_tag }}' --repo '${{ github.repository }}' >/dev/null 2>&1 || \
          gh release create '${{ steps.version.outputs.release_tag }}' --repo '${{ github.repository }}' --title '${{ steps.version.outputs.release_tag }}' --notes 'Gray release pipeline for TLS-shipinhao.'

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_glob: target/release/bundle/dmg/*.dmg
            artifact_name: mac.dmg
          - os: windows-latest
            artifact_glob: target/release/bundle/nsis/*.exe
            artifact_name: windows-setup.exe
    runs-on: ${{ matrix.os }}
    needs: prepare
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2'
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm --filter tls-shipinhao-ui build
      - name: Build app bundle
        working-directory: apps/desktop
        run: cargo tauri build
      - name: Generate version.json
        run: cargo run -p xtask -- release '${{ needs.prepare.outputs.app_version }}' dist/release
      - name: Generate integrity manifest (best effort)
        shell: bash
        run: |
          set -euo pipefail
          asset=$(find target/release/bundle -type f \( -name '*.dmg' -o -name '*.exe' \) | head -1 || true)
          if [ -n "$asset" ]; then
            asset_name=$(basename "$asset")
            cargo run -p xtask -- manifest target/release/bundle dist/release/integrity_manifest.json "$asset_name"
          else
            echo 'no bundle asset found, skip manifest generation'
          fi
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.prepare.outputs.release_tag }}'
          shopt -s nullglob
          for asset in ${{ matrix.artifact_glob }} dist/release/version.json dist/release/integrity_manifest.json; do
            if [ -f "$asset" ]; then
              gh release upload "$tag" "$asset" --repo '${{ github.repository }}' --clobber
            fi
          done
