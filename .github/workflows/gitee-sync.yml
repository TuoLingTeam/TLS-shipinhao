name: Sync Release Assets To Gitee

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的 Release 标签，例如 v4.3.0'
        required: false
        type: string

permissions:
  contents: read

env:
  GITEE_REPO_URL: https://gitee.com/tuolingshe/tuoling-shipinhao.git
  GITEE_RAW_BASE: https://gitee.com/tuolingshe/tuoling-shipinhao/raw/master

jobs:
  sync-release-assets:
    name: Sync Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.release.tag_name || '' }}" ]]; then
            tag="${{ github.event.release.tag_name }}"
          elif [[ -n "${{ inputs.tag || '' }}" ]]; then
            tag="${{ inputs.tag }}"
          else
            echo "未提供 Release tag。" >&2
            exit 1
          fi

          version="${tag#v}"
          build_date="$(date -u +%Y%m%d)"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_date=$build_date" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-assets
          gh release download "${{ steps.release_meta.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir /tmp/release-assets

          echo "已下载 Release 资产："
          ls -la /tmp/release-assets

      - name: Locate Mac and Windows zip assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
from pathlib import Path
import os

assets_dir = Path('/tmp/release-assets')
files = [p for p in assets_dir.iterdir() if p.is_file()]

mac_candidates = [p for p in files if p.suffix.lower() == '.zip' and 'mac' in p.name.lower()]
win_candidates = [p for p in files if p.suffix.lower() == '.zip' and ('windows' in p.name.lower() or 'win' in p.name.lower())]

if not mac_candidates:
    raise SystemExit('未找到 Mac zip 资产，请确保 Release 中包含带 mac 字样的 zip 文件。')
if not win_candidates:
    raise SystemExit('未找到 Windows zip 资产，请确保 Release 中包含带 windows/win 字样的 zip 文件。')

mac_asset = sorted(mac_candidates)[0]
win_asset = sorted(win_candidates)[0]

with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
    fh.write(f"mac_asset={mac_asset}\n")
    fh.write(f"win_asset={win_asset}\n")
PY

      - name: Clone Gitee update repo
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GITEE_USERNAME}" || -z "${GITEE_TOKEN}" ]]; then
            echo "请先在 GitHub Secrets 中配置 GITEE_USERNAME 和 GITEE_TOKEN。" >&2
            exit 1
          fi
          git clone "https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/tuolingshe/tuoling-shipinhao.git" /tmp/gitee-sync-repo

      - name: Sync assets and rewrite version.json
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/gitee-sync-repo
          mkdir -p mac windows

          mac_name="TLS-shipinhao-${{ steps.release_meta.outputs.version }}-mac.zip"
          win_name="TLS-shipinhao-${{ steps.release_meta.outputs.version }}-win.zip"

          cp "${{ steps.assets.outputs.mac_asset }}" "mac/${mac_name}"
          cp "${{ steps.assets.outputs.win_asset }}" "windows/${win_name}"

          python3 - <<'PY'
from pathlib import Path
import json
import os

version = os.environ['VERSION']
build_date = int(os.environ['BUILD_DATE'])
raw_base = os.environ['RAW_BASE']
version_payload = {
    'app': 'TLS-shipinhao',
    'version': version,
    'build': build_date,
    'mandatory': False,
    'mac': {
        'url': f"{raw_base}/mac/TLS-shipinhao-{version}-mac.zip"
    },
    'windows': {
        'url': f"{raw_base}/windows/TLS-shipinhao-{version}-win.zip"
    }
}
Path('version.json').write_text(
    json.dumps(version_payload, ensure_ascii=False, indent=2) + '\n',
    encoding='utf-8',
)
PY
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
          BUILD_DATE: ${{ steps.release_meta.outputs.build_date }}
          RAW_BASE: ${{ env.GITEE_RAW_BASE }}

      - name: Commit and push to Gitee
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/gitee-sync-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json mac/ windows/
          if git diff --cached --quiet; then
            echo "没有需要同步的变更。"
            exit 0
          fi
          git commit -m "同步 Release ${{ steps.release_meta.outputs.tag }} 到 Gitee"
          git push origin master

      - name: Summarize sync result
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "### Gitee 同步结果"
            echo "- Tag: ${{ steps.release_meta.outputs.tag }}"
            echo "- Version: ${{ steps.release_meta.outputs.version }}"
            echo "- Mac 资产: ${{ steps.assets.outputs.mac_asset || '未解析' }}"
            echo "- Windows 资产: ${{ steps.assets.outputs.win_asset || '未解析' }}"
            echo "- Gitee 仓库: ${{ env.GITEE_REPO_URL }}"
            echo "- version.json: ${{ env.GITEE_RAW_BASE }}/version.json"
          } >> "$GITHUB_STEP_SUMMARY"
